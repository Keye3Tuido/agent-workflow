schema_version: "1.0"
purpose: "验证森林、状态和安装行为"
contents_summary: "用临时夹具覆盖正常流程、错误、模块关系、缓存和并发安全"
files:
  - name: "test_context_cache.py"
    purpose: "测试缓存构建、命中、失效、禁用、模块聚焦和核心成员"
  - name: "test_doc_forest.py"
    purpose: "测试检查范围、排除、白名单、递归、模块字段和 YAML 错误"
  - name: "test_forest_architecture.py"
    purpose: "测试文件与目录模块视图、直接依赖和反向依赖"
  - name: "test_forest_context.py"
    purpose: "测试定位精度、模块检索、行号、相关测试和扫描预算"
  - name: "test_install_and_package.py"
    purpose: "测试权威实体、链接、冲突保护和包规范"
  - name: "test_state_files.py"
    purpose: "测试状态生命周期、会话绑定和并发写入"
