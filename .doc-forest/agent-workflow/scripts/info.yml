schema_version: "1.0"
purpose: "提供确定性工作流工具"
contents_summary: "森林检查、架构与上下文查询、状态写入和链接安装"
boundary: "提供命令行工具，不保存运行时服务或业务事实副本"
files:
  - name: "check_doc_forest.py"
    purpose: "只读检查完整或局部森林并输出报告"
    boundary: "只读校验，不修改项目"
    entry: "main"
    depends_on:
      - target: "yaml_common.py"
        reason: "提供严格 YAML 读取与字段校验"
  - name: "context_cache.py"
    purpose: "提供可重建的模块级内容缓存与失效核验"
    boundary: "只写派生缓存，不修改源码或 Forest"
    entry: "ContextCache"
    depends_on:
      - target: "yaml_common.py"
        reason: "使用文件锁保护缓存构建与扩展"
  - name: "forest_architecture.py"
    purpose: "按模块展示职责、直接依赖和反向依赖"
    boundary: "只展示声明的直接关系，不证明完整运行时调用链"
    entry: "build_architecture"
    depends_on:
      - target: "module_model.py"
        reason: "解析模块路径和直接关系"
      - target: "context_cache.py"
        reason: "复用缓存中的模块元数据"
  - name: "forest_context.py"
    purpose: "按需求输出候选源码、核心成员、相关测试、模块和行号"
    boundary: "不修改源码或 Forest，仅写可重建的派生缓存"
    entry: "main"
    depends_on:
      - target: "check_doc_forest.py"
        reason: "复用森林范围、排除和停止递归规则"
      - target: "context_cache.py"
        reason: "复用模块级内容缓存与失效核验"
  - name: "install_links.py"
    purpose: "安装共享实体和宿主链接，保护已有文件"
    boundary: "仅安装时写共享目录与链接"
    entry: "main"
  - name: "module_model.py"
    purpose: "解析和校验功能模块边界、入口与直接依赖"
    boundary: "只处理模块元数据，不分析运行时调用"
  - name: "state_files.py"
    purpose: "维护要求、任务状态和提交前清理"
    boundary: "仅维护要求与任务，不处理森林镜像"
    entry: "main"
    depends_on:
      - target: "yaml_common.py"
        reason: "提供严格 YAML、文件锁和原子替换"
  - name: "update_skill.py"
    purpose: "查询最新 release，按需下载、校验并备份更新共享 Skill"
    boundary: "检查不写文件，实际更新保留旧目录备份"
    entry: "main"
  - name: "yaml_common.py"
    purpose: "提供严格 YAML、文件锁和原子写入"
    boundary: "仅提供基础设施，不决定业务流程"
